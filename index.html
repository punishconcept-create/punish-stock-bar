<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Punish Concept">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Punish Concept</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;background:#050505;overflow:hidden}
    body{font-family:Arial,Helvetica,sans-serif;color:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#050505}
    #msg{display:none;min-height:100%;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;text-align:center}
    .box{max-width:520px}
    h1{letter-spacing:.18em;font-size:22px}
    p{color:#bbb;line-height:1.45}
  </style>
</head>
<body>
<div id="app"></div>
<div id="msg"><div class="box"><h1>PUNISH CONCEPT</h1><p>Lien d’accès manquant. Ouvre d’abord le lien personnel fourni par Punish Concept.</p></div></div>
<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbyI2U-n0zBA6Db1zb7gyJTawqYOgLkUfexNAgX1Mj2b-nqShmCKRZqBCDAQwXkf297s/exec";
const qs = new URLSearchParams(location.search);
const incoming = (qs.get('access') || '').trim();

if (incoming) {
  localStorage.setItem('punish_access', incoming);
  history.replaceState(null, '', location.pathname);
}

const access = incoming || localStorage.getItem('punish_access') || '';

if (access) {
  const frame = document.createElement('iframe');
  frame.id = 'punishApp';
  frame.allow = 'camera; clipboard-read; clipboard-write';
  frame.src = APP_URL + '?access=' + encodeURIComponent(access);
  document.getElementById('app').appendChild(frame);
} else {
  document.getElementById('app').style.display='none';
  document.getElementById('msg').style.display='flex';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
