<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Stock Bar">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Punish Concept — Stock Bar</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{min-height:100dvh}
    #app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#000;display:block}
    #loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#000;color:#fff;font:700 13px Arial,sans-serif;letter-spacing:4px;text-align:center}
    #loading img{display:block;width:150px;max-width:40vw;margin:0 auto 18px}
  </style>
</head>
<body>
  <div id="loading"><div><img src="./icon-512.png" alt="Punish Concept">STOCK BAR</div></div>

  <iframe
    id="app"
    title="Punish Concept — Stock Bar"
    src="about:blank"
    allow="camera; microphone; clipboard-read; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const APP_URL = 'https://script.google.com/macros/s/AKfycbySzHGXztLTaAYX6eyDmgbW4ih42Fj_J1FQUjmGg1xvZNCmV47JvgRG2orDJSk9yC8O/exec';
    const ACCESS_KEY = 'punish_stock_access';

    function getAccessToken() {
      const params = new URLSearchParams(window.location.search);
      const incoming = String(params.get('access') || '').trim();

      if (incoming) {
        try { localStorage.setItem(ACCESS_KEY, incoming); } catch (e) {}

        // Le token est retiré de la barre d'adresse après mémorisation.
        params.delete('access');
        const query = params.toString();
        const cleanUrl =
          window.location.pathname +
          (query ? '?' + query : '') +
          window.location.hash;
        history.replaceState(null, '', cleanUrl);

        return incoming;
      }

      try {
        return String(localStorage.getItem(ACCESS_KEY) || '').trim();
      } catch (e) {
        return '';
      }
    }

    const accessToken = getAccessToken();
    const params = new URLSearchParams();
    if (accessToken) params.set('access', accessToken);

    // Conserve aussi un éventuel événement demandé.
    const requestedEvent =
      String(new URLSearchParams(window.location.search).get('event') || '').trim();
    if (requestedEvent) params.set('event', requestedEvent);

    frame.src = APP_URL + (params.toString() ? '?' + params.toString() : '');

    frame.addEventListener('load', () => {
      loading.style.display = 'none';
    });

    setTimeout(() => {
      loading.style.display = 'none';
    }, 8000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
          await navigator.serviceWorker.register('./service-worker.js', {scope:'./'});
        } catch (e) {}
      });
    }
  </script>
</body>
</html>
